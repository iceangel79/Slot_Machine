<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slot Machine Simulator</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>

<body>
    <div id="app">
        <h1>Slot Machine Simulator</h1>
        <p v-if="health === null">Checking backend...</p>
        <p v-else>
            Backend: {{ health.status }}, database: {{ health.database }}
        </p>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return { health: null };
            },
            async mounted() {
                try {
                    const response = await fetch("/api/health");
                    this.health = await response.json();
                } catch (error) {
                    this.health = { status: "unreachable", database: "unknown" };
                }
            },
        }).mount("#app");
    </script>
</body>

</html>
